[project]
name = "wind-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.121.3",
    "pydantic==2.12.5",
    "psycopg[binary]==3.2.12",
    "uvicorn[standard]==0.38.0",
    "black>=26.10.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
